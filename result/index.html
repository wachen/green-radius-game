<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Your Green Radius</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../game-data.js"></script>
<script type="text/babel" src="../green-radius.jsx"></script>
<script src="../result-state.js"></script>
</head>
<body style="margin:0;padding:0;background:#D8CBB6;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;">
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#D8CBB6;padding:24px"></div>

<script type="text/babel" data-presets="react">
// ShareCard is defined in green-radius.jsx (another text/babel script). Babel-standalone runs all
// text/babel scripts in a shared scope, so reference it by bare name — it is NOT a window property
// (this mirrors how index.html mounts the game via a bare <GreenRadiusGame/>).
const data = window.ResultState.decode(window.location.hash);
const root = ReactDOM.createRoot(document.getElementById('root'));
if (!data) {
  root.render(<p style={{ fontFamily: 'system-ui', color: '#3c2a1e' }}>This result link looks invalid or incomplete.</p>);
} else {
  root.render(
    <ShareCard sectors={window.SECTORS} fills={data.fills}
      campName={data.campName} leadName={data.leadName} year={data.year} palette={{}} />
  );
}
</script>
</body>
</html>
