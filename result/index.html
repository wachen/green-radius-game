<style>
  /* Same vendored Space Grotesk as index.html (see the comment there). */
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('/vendor/fonts/space-grotesk-v22-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* Loading placeholder shown until React mounts (root.render clears it). */
  .grg-loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; color: #2a2620;
  }
  .grg-loading .grg-loading-wheel {
    transform-box: view-box; transform-origin: 32px 33px;
    animation: grg-loading-spin 1.2s linear infinite;
  }
  .grg-loading .grg-loading-slow {
    opacity: 0; animation: grg-loading-reveal 0.4s ease 6s forwards;
    font-size: 13px; color: #2a2620aa; max-width: 280px;
  }
  @keyframes grg-loading-spin { to { transform: rotate(360deg); } }
  @keyframes grg-loading-reveal { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .grg-loading .grg-loading-wheel { animation: none; }
  }
</style>

<body style="margin:0;padding:0;background:#D8CBB6;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;">
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#D8CBB6;padding:24px">
  <div class="grg-loading">
    <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
      <g class="grg-loading-wheel">
        <path fill="#A3D178" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L32 10 A23 23 0 0 1 51.92 21.5 Z"/>
        <path fill="#86C169" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L51.92 21.5 A23 23 0 0 1 51.92 44.5 Z"/>
        <path fill="#68B05C" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L51.92 44.5 A23 23 0 0 1 32 56 Z"/>
        <path fill="#56A85C" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L32 56 A23 23 0 0 1 12.08 44.5 Z"/>
        <path fill="#439F5B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L12.08 44.5 A23 23 0 0 1 12.08 21.5 Z"/>
        <path fill="#31975B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L12.08 21.5 A23 23 0 0 1 32 10 Z"/>
        <circle cx="32" cy="33" r="23" fill="none" stroke="#2a2620" stroke-width="2.8"/>
        <circle cx="32" cy="33" r="3.4" fill="#2a2620"/>
      </g>
      <polygon points="32,12 26.8,3 37.2,3" fill="#2a2620"/>
    </svg>
    <div style="font-weight:700">Loading your Green Radius…</div>
    <div class="grg-loading-slow">Still loading. On a slow connection the card can take a little while the first time.</div>
  </div>
</div>
<noscript>
  <style>.grg-loading { display: none; } #root { min-height: 0 !important; padding: 0 !important; }</style>
  <div style="text-align:center;padding:40px 24px;font-family:system-ui">
    The Green Radius Game needs JavaScript to run. Please enable it and reload.
  </div>
</noscript>

<script type="text/babel" data-presets="react">
// ShareCard is defined in green-radius.jsx (another text/babel script). Babel-standalone runs all
// text/babel scripts in a shared scope, so reference it by bare name — it is NOT a window property
// (this mirrors how index.html mounts the game via a bare <GreenRadiusGame/>).
const data = window.ResultState.decode(
  new URLSearchParams(window.location.search).get('r') || window.location.hash
);

// Read-only card + the same Download / Share Link actions as the done screen.
// ShareCard, ResultCardSVG, downloadSvgAsPng, svgToPngBlob, CARD_W/H all live in
// green-radius.jsx and are reachable by bare name in the shared Babel scope.
function ResultView({ sectors, fills, campName, leadName, year }) {
  const cardSvgRef = React.useRef(null);
  const cardPngRef = React.useRef(null);
  const [copied, setCopied] = React.useState(false);
  const total = sectors.reduce((n, s) => n + ((fills[s.id] && fills[s.id].totalYes) || 0), 0);
  const slug = (campName || 'theme-camp').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'theme-camp';
  const resultUrl = window.location.href; // this page *is* the result link

  // Pre-rasterize the card so Web Share has the file ready inside the tap gesture.
  React.useEffect(() => {
    if (!cardSvgRef.current) return;
    let alive = true;
    svgToPngBlob(cardSvgRef.current).then(b => { if (alive) cardPngRef.current = b; }).catch(() => {});
    return () => { alive = false; };
  }, []);

  async function handleDownload() {
    if (!cardSvgRef.current) return;
    try { await downloadSvgAsPng(cardSvgRef.current, `green-radius-${slug}.png`); } catch {}
  }
  async function handleShare() {
    const shareText = `Our camp reached ${total}/60. Build your camp's Green Radius:`;
    const blob = cardPngRef.current;
    const file = blob ? new File([blob], `green-radius-${slug}.png`, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Our Green Radius', text: shareText, url: resultUrl }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (navigator.share) {
      try { await navigator.share({ title: 'Our Green Radius', text: shareText, url: resultUrl }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(resultUrl); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {}
  }

  const btn = { flex: 1, padding: '14px 0', borderRadius: 12, border: 'none', color: '#fff',
    fontSize: 13, fontWeight: 800, letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer' };
  return (
    <div style={{ width: 'min(360px, 100%)', display: 'flex', flexDirection: 'column', gap: 14 }}>
      <ShareCard sectors={sectors} fills={fills} campName={campName} leadName={leadName} year={year} palette={{}} />
      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={handleDownload} style={{ ...btn, background: '#7AB85C', boxShadow: '0 3px 0 #558040' }}>⬇ Download</button>
        <button onClick={handleShare} style={{ ...btn, background: '#3B6FD4', boxShadow: '0 3px 0 #2b539e' }}>
          {copied ? 'Link copied!' : '↗ Share link'}
        </button>
      </div>
      {/* offscreen SVG twin of the card — serialized to PNG by handleDownload/share */}
      <div aria-hidden="true" style={{ position: 'absolute', left: -99999, top: 0, width: CARD_W, height: CARD_H, overflow: 'hidden', pointerEvents: 'none' }}>
        <ResultCardSVG svgRef={cardSvgRef} sectors={sectors} fills={fills} campName={campName} leadName={leadName} year={year}/>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
if (!data) {
  root.render(
    <div style={{
      background: 'linear-gradient(155deg, #1c1410 0%, #2a1c14 100%)',
      borderRadius: 24, color: '#fff', padding: '36px 28px', maxWidth: 360,
      textAlign: 'center', boxShadow: '0 24px 60px rgba(0,0,0,0.5)',
    }}>
      <div style={{ fontSize: 10, letterSpacing: '0.25em', fontWeight: 700, opacity: 0.6, marginBottom: 10 }}>GREEN RADIUS</div>
      <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 8 }}>This result link looks incomplete.</div>
      <div style={{ fontSize: 13, lineHeight: 1.5, opacity: 0.75, marginBottom: 20 }}>
        Result links carry the whole scorecard after the # mark, so make sure the full link was copied. Or start fresh and build your own.
      </div>
      <a href="/" style={{
        display: 'inline-block', background: '#5BA84A', color: '#fff',
        padding: '12px 22px', borderRadius: 14, fontWeight: 700, fontSize: 14,
        textDecoration: 'none', boxShadow: '0 3px 0 #3d7a31',
      }}>Play your own Green Radius</a>
    </div>
  );
} else {
  root.render(
    <ResultView sectors={window.SECTORS} fills={data.fills}
      campName={data.campName} leadName={data.leadName} year={data.year} />
  );
}
</script>
</body>
</html>
