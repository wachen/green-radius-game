<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Your Green Radius</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="../game-data.js"></script>
<script type="text/babel" src="../green-radius.jsx"></script>
<script src="../result-state.js"></script>
</head>
<body style="margin:0;padding:0;background:#D8CBB6;">
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#D8CBB6;padding:24px"></div>

<script type="text/babel" data-presets="react">
// ShareCard is defined in green-radius.jsx (another text/babel script). Babel-standalone runs all
// text/babel scripts in a shared scope, so reference it by bare name — it is NOT a window property
// (this mirrors how index.html mounts the game via a bare <GreenRadiusGame/>).
const data = window.ResultState.decode(window.location.hash);
const root = ReactDOM.createRoot(document.getElementById('root'));
if (!data) {
  root.render(<p style={{ fontFamily: 'system-ui', color: '#3c2a1e' }}>This result link looks invalid or incomplete.</p>);
} else {
  const levelStates = window.ResultState.greensToLevelStates(data.greens);
  root.render(
    <ShareCard sectors={window.SECTORS} levelStates={levelStates}
      campName={data.campName} leadName={data.leadName} year={data.year} palette={{}} />
  );
}
</script>
</body>
</html>
