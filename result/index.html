<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#D8CBB6"/>
<!-- Loads first, no defer: installs window.onerror/unhandledrejection before
     any deferred vendor/dist script runs, so a white-screen bug still phones home. -->
<script src="/beacon.js"></script>
<title>Your Green Radius</title>
<!-- Keeps one camp's name and score out of search results. It has to be a meta
     tag, not an X-Robots-Tag in _headers: wrangler.jsonc sets
     run_worker_first:["/result/"], so this route is served by the Worker via
     env.ASSETS.fetch(), which bypasses the asset layer that applies _headers.
     noindex, not a robots.txt Disallow, so link unfurlers can still fetch the
     page and read the og: tags the Worker rewrites. -->
<meta name="robots" content="noindex"/>
<meta name="description" content="See how green this Burning Man theme camp went, sector by sector. Play your own at greenradi.us."/>
<meta property="og:type" content="website"/>
<!-- No og:url here on purpose: platforms that treat og:url as the canonical click
     target (Facebook, LinkedIn) would strip the #fragment that carries the whole
     result, sending viewers to the empty fallback instead of the camp's card. -->
<meta property="og:title" content="Our Green Radius"/>
<meta property="og:description" content="See how green this Burning Man theme camp went, sector by sector. Play your own at greenradi.us."/>
<meta property="og:image" content="https://greenradi.us/og-card.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="Green Radius Game. A radial sustainability scorecard for Burning Man theme camps."/>
<meta name="twitter:card" content="summary_large_image"/>

<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

<link rel="preload" href="/vendor/fonts/space-grotesk-v22-latin.woff2" as="font" type="font/woff2" crossorigin/>

<script defer src="/vendor/preact-10.29.7.min.umd.js"></script>
<script defer src="/vendor/preact-hooks-10.29.7.umd.js"></script>
<script defer src="/vendor/preact-compat-10.29.7.umd.js"></script>
<script defer src="/vendor/preact-compat-shim-10.29.7.js"></script>

<script defer src="../game-data.js"></script>
<!-- Just the precompiled game-UI modules this read-only page renders (dist/
     artifacts, core first): ShareCard/ResultCardSVG/PNG export + the badge they
     draw. result-state.js then the page boot load last. -->
<script defer src="../dist/src/core.js"></script>
<script defer src="../dist/src/badge.js"></script>
<script defer src="../dist/src/share-card.js"></script>
<script defer src="../result-state.js"></script>
<script defer src="../dist/src/boot-result.js"></script>

<!-- Cloudflare Web Analytics (pageviews + Web Vitals). The beacon token is public by design, safe to commit. -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "02765e32c9dc4e309cc4ce42de3523c7"}'></script>

<!-- Vendored Space Grotesk + the pre-mount loading placeholder. -->
<link rel="stylesheet" href="/shared.css"/>
</head>
<body style="margin:0;padding:0;background:#D8CBB6;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;">
<!-- Children carry margin:auto for centering: Safari aligns flex children
     against min-height (not the grown height), so align-items:center alone
     pushes tall content off the top; auto margins clamp to 0 instead. -->
<div id="root" style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#D8CBB6;padding:24px;box-sizing:border-box">
  <div class="grg-loading" style="margin:auto">
    <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
      <g class="grg-loading-wheel">
        <path fill="#A3D178" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L32 10 A23 23 0 0 1 51.92 21.5 Z"/>
        <path fill="#86C169" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L51.92 21.5 A23 23 0 0 1 51.92 44.5 Z"/>
        <path fill="#68B05C" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L51.92 44.5 A23 23 0 0 1 32 56 Z"/>
        <path fill="#56A85C" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L32 56 A23 23 0 0 1 12.08 44.5 Z"/>
        <path fill="#439F5B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L12.08 44.5 A23 23 0 0 1 12.08 21.5 Z"/>
        <path fill="#31975B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" d="M32 33 L12.08 21.5 A23 23 0 0 1 32 10 Z"/>
        <circle cx="32" cy="33" r="23" fill="none" stroke="#2a2620" stroke-width="2.8"/>
        <circle cx="32" cy="33" r="3.4" fill="#2a2620"/>
      </g>
      <polygon points="32,12 26.8,3 37.2,3" fill="#2a2620"/>
    </svg>
    <div style="font-weight:700">Loading your Green Radius…</div>
    <div class="grg-loading-slow">Still loading. On a slow connection the card can take a little while the first time.</div>
  </div>
</div>
<noscript>
  <style>.grg-loading { display: none; } #root { min-height: 0 !important; padding: 0 !important; }</style>
  <div style="text-align:center;padding:40px 24px;font-family:system-ui">
    The Green Radius Game needs JavaScript to run. Please enable it and reload.
  </div>
</noscript>

</body>
</html>
