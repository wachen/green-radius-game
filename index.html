<style>
  /* Space Grotesk vendored same-origin like the JS runtime (was a
     render-blocking fonts.googleapis.com stylesheet). One variable-font file
     covers weights 300-700 for the latin subset; heavier weights render at
     700, exactly as the old Google CSS resolved them. */
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('/vendor/fonts/space-grotesk-v22-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    background: #D8CBB6;
    color: #2a2620;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    min-height: 100dvh;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  input:focus-visible, select:focus-visible {
    outline: 2px solid #2a2620;
    outline-offset: 1px;
  }
  button:focus-visible {
    outline: 2px solid #2a2620;
    outline-offset: 2px;
  }
  [role="dialog"] button[aria-label="Close"]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  @keyframes qm-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes qm-up   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes grg-splat {
    0%   { opacity: 0; transform: scale(0.2); }
    35%  { opacity: 0.75; transform: scale(1.15); }
    70%  { opacity: 0.55; transform: scale(1.35); }
    100% { opacity: 0; transform: scale(1.55); }
  }
  @keyframes grg-celeb {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55) rotate(-3deg); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(-3deg); }
    32%  { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    80%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95) rotate(-3deg); }
  }
  @keyframes grg-spring      { 0% { transform: scale(1); } 35% { transform: scale(0.88); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes grg-spring-soft { 0% { transform: scale(1); } 45% { transform: scale(0.95); } 100% { transform: scale(1); } }
  @keyframes grg-shine { 0% { opacity: 0; } 22% { opacity: 0.8; } 100% { opacity: 0; } }
  .grg-shine { animation: grg-shine 0.95s ease forwards; }
  @keyframes grg-wpop     { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes grg-tick     { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes grg-rankslam { 0% { opacity: 0; transform: scale(2.2) rotate(-10deg); } 55% { opacity: 1; transform: scale(0.95) rotate(-3deg); } 75% { transform: scale(1.04) rotate(-3deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }

  /* Toy/board-game buttons: a hard drop-shadow "foot" that compresses on
     press, so the button physically depresses instead of just changing
     color. Color comes from --grg-sh since a class's box-shadow can't be
     overridden per-instance any other way while still winning over the
     inline style it replaces. */
  .grg-press { box-shadow: 0 5px 0 var(--grg-sh); transition: transform .09s ease, box-shadow .09s ease; }
  .grg-press:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--grg-sh); }
  .grg-press-sm { box-shadow: 0 4px 0 var(--grg-sh); transition: transform .09s ease, box-shadow .09s ease; }
  .grg-press-sm:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--grg-sh); }
  @media (prefers-reduced-motion: reduce) {
    .grg-press:active:not(:disabled)    { transform: none; box-shadow: 0 5px 0 var(--grg-sh); }
    .grg-press-sm:active:not(:disabled) { transform: none; box-shadow: 0 4px 0 var(--grg-sh); }
  }
  @media (prefers-reduced-motion: reduce) {
    @keyframes qm-fade { from { opacity: 1; } to { opacity: 1; } }
    @keyframes qm-up   { from { opacity: 1; transform: none; } to { opacity: 1; transform: none; } }
    @keyframes grg-splat { from { opacity: 0; } to { opacity: 0; } }
    @keyframes grg-celeb { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 1; transform: translate(-50%, -50%); } }
    @keyframes grg-spring      { from { transform: none; } to { transform: none; } }
    @keyframes grg-spring-soft { from { transform: none; } to { transform: none; } }
    @keyframes grg-shine { from { opacity: 0; } to { opacity: 0; } }
    @keyframes grg-wpop     { from { transform: none; } to { transform: none; } }
    @keyframes grg-tick     { from { transform: none; } to { transform: none; } }
    @keyframes grg-rankslam { from { opacity: 1; transform: none; } to { opacity: 1; transform: none; } }
  }

  /* Loading placeholder shown until React mounts (root.render clears it). */
  .grg-loading {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; color: #2a2620;
  }
  .grg-loading .grg-loading-dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: conic-gradient(#7AB85C 0 50%, #2a2620 50% 100%);
    animation: grg-loading-spin 1.2s linear infinite;
  }
  .grg-loading .grg-loading-slow {
    opacity: 0; animation: grg-loading-reveal 0.4s ease 6s forwards;
    font-size: 13px; color: #2a2620aa; max-width: 280px;
  }
  @keyframes grg-loading-spin { to { transform: rotate(360deg); } }
  @keyframes grg-loading-reveal { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .grg-loading .grg-loading-dot { animation: none; }
  }

  /* Responsive shell: full-bleed on mobile, phone-shaped frame on larger screens. */
  .grg-shell {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    background: #D8CBB6;
  }
  .grg-frame {
    width: 100%;
    max-width: 480px;
    background: #ede9e0;
    position: relative;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 600px) {
    .grg-shell {
      align-items: center;
      padding: 24px;
      background: #C7BBA1;
    }
    .grg-frame {
      max-width: 440px;
      min-height: 880px;
      border-radius: 28px;
      box-shadow: 0 30px 80px -20px rgba(40,30,20,0.35), 0 0 0 1px rgba(40,30,20,0.06);
    }
  }
</style>

<script type="text/babel" data-presets="react">
const PALETTE = {
  label: 'Alkali Flat',
  bg: '#ede9e0',
  canvas: '#2a2620',
  card: '#fcfaf4',
  text: '#2a2620',
  heading: '#2a2620',
  hub: '#3a3128',
  hubStroke: '#4a4036',
  accent: '#7AB85C',
  accentDark: '#558040',
};

function App() {
  return (
    <div className="grg-shell">
      <div className="grg-frame">
        <GreenRadiusGame variant="flat-playa" palette={PALETTE}/>
      </div>
      <FxLayer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
