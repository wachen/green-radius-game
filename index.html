<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a2620'/%3E%3Cpath d='M3 16a13 13 0 1 1 26 0z' fill='%237AB85C'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232a2620'/%3E%3C/svg%3E"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    background: #D8CBB6;
    color: #2a2620;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    min-height: 100dvh;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  input:focus-visible, select:focus-visible {
    outline: 2px solid #2a2620;
    outline-offset: 1px;
  }
  button:focus-visible {
    outline: 2px solid #2a2620;
    outline-offset: 2px;
  }

  @keyframes qm-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes qm-up   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes grg-splat {
    0%   { opacity: 0; transform: scale(0.2); }
    35%  { opacity: 0.75; transform: scale(1.15); }
    70%  { opacity: 0.55; transform: scale(1.35); }
    100% { opacity: 0; transform: scale(1.55); }
  }
  @keyframes grg-celeb {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55) rotate(-3deg); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(-3deg); }
    32%  { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    80%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95) rotate(-3deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    @keyframes qm-fade { from { opacity: 1; } to { opacity: 1; } }
    @keyframes qm-up   { from { opacity: 1; transform: none; } to { opacity: 1; transform: none; } }
    @keyframes grg-splat { from { opacity: 0; } to { opacity: 0; } }
    @keyframes grg-celeb { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  }

  /* Loading placeholder shown until React mounts (root.render clears it). */
  .grg-loading {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; color: #2a2620;
  }
  .grg-loading .grg-loading-dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: conic-gradient(#7AB85C 0 50%, #2a2620 50% 100%);
    animation: grg-loading-spin 1.2s linear infinite;
  }
  .grg-loading .grg-loading-slow {
    opacity: 0; animation: grg-loading-reveal 0.4s ease 6s forwards;
    font-size: 13px; color: #2a2620aa; max-width: 280px;
  }
  @keyframes grg-loading-spin { to { transform: rotate(360deg); } }
  @keyframes grg-loading-reveal { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .grg-loading .grg-loading-dot { animation: none; }
  }

  /* Responsive shell: full-bleed on mobile, phone-shaped frame on larger screens. */
  .grg-shell {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: stretch;
    justify-content: center;
    background: #D8CBB6;
  }
  .grg-frame {
    width: 100%;
    max-width: 480px;
    background: #ede9e0;
    position: relative;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 600px) {
    .grg-shell {
      align-items: center;
      padding: 24px;
      background: #C7BBA1;
    }
    .grg-frame {
      max-width: 440px;
      min-height: 880px;
      border-radius: 28px;
      box-shadow: 0 30px 80px -20px rgba(40,30,20,0.35), 0 0 0 1px rgba(40,30,20,0.06);
    }
  }
</style>

<script defer src="/vendor/react-18.3.1.production.min.js"></script>
<script defer src="/vendor/react-dom-18.3.1.production.min.js"></script>
<script defer src="/vendor/babel-standalone-7.29.0.min.js"></script>

<script defer src="game-data.js"></script>
<script defer src="result-state.js"></script>
<script type="text/babel" src="green-radius.jsx"></script>
</head>
<body>
<div id="root">
  <div class="grg-loading">
    <div class="grg-loading-dot" aria-hidden="true"></div>
    <div style="font-weight:700">Loading the Green Radius Game…</div>
    <div class="grg-loading-slow">Still loading. On a slow connection the game can take a little while the first time.</div>
  </div>
</div>
<noscript>
  <style>.grg-loading { display: none; }</style>
  <div style="text-align:center;padding:40px 24px;font-family:system-ui">
    The Green Radius Game needs JavaScript to run. Please enable it and reload.
  </div>
</noscript>

<script type="text/babel" data-presets="react">
const PALETTE = {
  label: 'Alkali Flat',
  bg: '#ede9e0',
  canvas: '#2a2620',
  card: '#fcfaf4',
  text: '#2a2620',
  heading: '#2a2620',
  hub: '#3a3128',
  hubStroke: '#4a4036',
  accent: '#7AB85C',
  accentDark: '#558040',
};

function App() {
  return (
    <div className="grg-shell">
      <div className="grg-frame">
        <GreenRadiusGame variant="flat-playa" palette={PALETTE}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
