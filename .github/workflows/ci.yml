name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Parse gate (compile every game script)
        run: |
          for f in src/*.jsx green-radius.jsx; do
            echo "compiling $f"
            bun build "$f" --external react --external react/jsx-runtime --external react/jsx-dev-runtime > /dev/null
          done
      - name: Unit tests
        run: bun test
