name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin bun so the transpiler output is byte-identical to what was committed
      # locally — the compile+diff gate below depends on a deterministic build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Compile gate: recompile every game .jsx to dist/. A JSX/syntax error
      # throws here (this replaces the old `bun build` parse gate).
      - name: Compile gate (rebuild dist/ from the .jsx sources)
        run: bun run scripts/build.js
      # Sync gate: the committed dist/ artifacts must match a fresh build, so a
      # source edit can never ship without its recompiled artifact.
      - name: Verify committed dist/ is in sync with source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of sync with the .jsx sources. Run: bun run scripts/build.js"
            git status --porcelain -- dist
            git --no-pager diff -- dist
            exit 1
          fi
      - name: Unit tests
        run: bun test

  boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No package.json in this repo by design — install Playwright ad hoc,
      # pinned to match what's exercised locally.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      # Backgrounded here so it's still running for the "Boot-smoke" step below.
      - name: Serve the repo statically
        run: |
          python3 -m http.server 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::static server never came up"; exit 1
      # Drives headless Chromium against /, /result/, /city/, /admin/ and
      # asserts each one actually boots (see test/boot-smoke.mjs for what
      # "boots" means and why this exists).
      - name: Boot-smoke the four entry pages
        run: node test/boot-smoke.mjs http://localhost:8000
