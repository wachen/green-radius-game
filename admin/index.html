<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<!-- Loads first, no defer: installs window.onerror/unhandledrejection before
     any deferred vendor/dist script runs, so a white-screen bug still phones home. -->
<script src="/beacon.js"></script>
<!-- Kick the data fetch off now, in parallel with the script downloads below —
     React consumes this promise on mount (useResponses) instead of starting
     the request only after all five scripts have loaded and parsed. -->
<script>window.__earlyResponses = fetch('/api/admin/responses', { headers: { 'Accept': 'application/json' } }).catch(function () { return null; });</script>
<title>Green Radius — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preload" href="/vendor/fonts/space-grotesk-v22-latin.woff2" as="font" type="font/woff2" crossorigin/>
<script defer src="/vendor/preact-10.29.7.min.umd.js"></script>
<script defer src="/vendor/preact-hooks-10.29.7.umd.js"></script>
<script defer src="/vendor/preact-compat-10.29.7.umd.js"></script>
<script defer src="/vendor/preact-compat-shim-10.29.7.js"></script>
<script defer src="../game-data.js"></script>
<!-- Just the precompiled game-UI modules admin renders (dist/ artifacts, core
     first): RadialBadge/SectorIcon (badge.js) + core's scoring helpers. Then
     aggregate.js, the admin app, and the page boot. -->
<script defer src="../dist/src/core.js"></script>
<script defer src="../dist/src/badge.js"></script>
<script defer src="../playa-address.js"></script>
<script defer src="./aggregate.js"></script>
<script defer src="../dist/admin/admin.js"></script>
<script defer src="../dist/src/boot-admin.js"></script>

   placeholder below and the React loading states (LoadingWheel in admin.jsx). */
@keyframes grg-spin{to{transform:rotate(360deg)}}
.grg-spin{animation:grg-spin 1.1s linear infinite}
@media (prefers-reduced-motion: reduce){.grg-spin{animation:none}}
